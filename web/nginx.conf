# ============================================================
# cpa-sync 一体化网关 + Web 面板（项目自带配置，非系统默认）
# 由 cpa-sync-nginx install 安装（把 __PROJECT_ROOT__ 替换为实际路径）
#
# 结构（1 个 nginx 进程托管全部）：
#   8380  = CPA 本地网关（多点接入，upstream 213+253，故障自动切换）
#   17834 = Web 面板（nginx 直接发静态 index.html + /api/* 反代 Python）
#   17835 = Python API-only 后端（127.0.0.1，web/app.py）
# ============================================================

# ---- CPA 网关 upstream（多点接入：两 CPA 模型完全一致=冗余镜像）----
upstream cpa_upstream {
    server 192.168.31.213:8317;
    server 192.168.31.253:8317;
}

# ---- Web API 后端（Python，仅 API）----
upstream cpa_web_api {
    server 127.0.0.1:17835;
}

# ---- 8380 CPA 网关 ----
server {
    listen 8380;
    server_name _;
    location / {
        proxy_pass http://cpa_upstream;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}

# ---- 17834 Web 面板（静态 nginx 发 + /api 反代 Python）----
server {
    listen 17834;
    server_name _;
    root __PROJECT_ROOT__/web/static;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://cpa_web_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
