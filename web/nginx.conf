# ============================================================
# cpa-sync 网关模板 —— 由 scripts/render_gateway.py 渲染
# 渲染时替换：listen / upstreams / read_timeout（见 render_gateway.py）
# 控制面板（管理面）由 Python 自己 serve（web/app.py :panel_port），不经 nginx
# ============================================================

upstream cpa_upstream {
__UPSTREAMS__
}

server {
    listen __LISTEN__;
    server_name _;
    location / {
        proxy_pass http://cpa_upstream;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout __READ_TIMEOUT__;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}

# 控制面板远程反代（app.py 本机 127.0.0.1:panel_port，认证由 app.py 透传）
__PANEL_BLOCK__
