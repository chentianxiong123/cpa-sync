# 交叉编译：linux x86_64/arm64 + macOS x86_64/arm64
#
# 设计（用户拍板）：
#   - 编译全在 ubuntu-latest（免费无限）——linux 原生/zigbuild，macOS 用 osxcross
#   - macos-latest 只做 ad-hoc 签名（500 分钟免费额度用一点点，不再全程编译）
#   - macOS 交叉用 Timmmm/setup-osxcross@v2（SDK 来自 joseluisq/macosx-sdks，无需自备 SDK）
#   - 全流程带 actions/cache（cargo registry + target），避免每次全量重编
name: cross-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------- Linux（原生 + zigbuild 交叉） ----------------
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: 安装 zig（仅 arm64 交叉需要）
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz
          sudo tar -xf zig.tar.xz -C /opt
          echo "/opt/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"

      - name: 装依赖（rusqlite bundled 要系统 g++）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 装 cargo-zigbuild
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cargo-zigbuild --locked

      - name: cargo 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rs/target
          key: cargo-linux-${{ matrix.target }}-${{ hashFiles('rs/Cargo.lock') }}
          restore-keys: |
            cargo-linux-${{ matrix.target }}-

      - name: 构建
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cargo zigbuild --release --target aarch64-unknown-linux-gnu
          else
            cargo build --release --target x86_64-unknown-linux-gnu
          fi

      - name: 校验产物
        run: |
          BIN=${{ github.workspace }}/rs/target/${{ matrix.target }}/release/cpa-sync
          find . -type f -name cpa-sync -path '*release*' -exec ls -lh {} \;
          file "$BIN"
          test -x "$BIN"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cpa-sync-${{ matrix.target }}
          path: rs/target/${{ matrix.target }}/release/cpa-sync
          if-no-files-found: error
          compression-level: 1

  # ---------------- macOS（ubuntu + osxcross 交叉，编译免费） ----------------
  macos-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@v4

      - name: 安装 osxcross + SDK（首次 ~9 分钟，SDK 来自 joseluisq/macosx-sdks）
        uses: Timmmm/setup-osxcross@v2
        with:
          osx-version: "12.3"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: cargo 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rs/target
          key: cargo-macos-${{ hashFiles('rs/Cargo.lock') }}
          restore-keys: |
            cargo-macos-

      - name: 构建 x86_64-apple-darwin
        env:
          CC_x86_64_apple_darwin: o64-clang
          CXX_x86_64_apple_darwin: o64-clang++
          CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: o64-clang
          LIBZ_SYS_STATIC: "1"
        run: cargo build --release --target x86_64-apple-darwin

      - name: 构建 aarch64-apple-darwin
        env:
          CC_aarch64_apple_darwin: oa64-clang
          CXX_aarch64_apple_darwin: oa64-clang++
          CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: oa64-clang
          LIBZ_SYS_STATIC: "1"
        run: cargo build --release --target aarch64-apple-darwin

      - name: 校验产物
        run: |
          find . -type f -name cpa-sync -path '*apple-darwin*release*' -exec file {} \;

      - name: 上传 x86_64
        uses: actions/upload-artifact@v4
        with:
          name: cpa-sync-x86_64-apple-darwin
          path: rs/target/x86_64-apple-darwin/release/cpa-sync
          if-no-files-found: error
          compression-level: 1

      - name: 上传 aarch64
        uses: actions/upload-artifact@v4
        with:
          name: cpa-sync-aarch64-apple-darwin
          path: rs/target/aarch64-apple-darwin/release/cpa-sync
          if-no-files-found: error
          compression-level: 1

  # ---------------- macOS 签名（macos-latest，只签名，500 分钟额度用一点点） ----------------
  macos-sign:
    runs-on: macos-latest
    needs: macos-build
    steps:
      - uses: actions/checkout@v4

      - name: 下载 macOS 产物
        uses: actions/download-artifact@v4
        with:
          pattern: cpa-sync-*-apple-darwin
          path: dist
          merge-multiple: true

      - name: ad-hoc 签名
        run: |
          find dist -type f -name cpa-sync | while read f; do
            echo "-- 签名 $f --"
            codesign --force --sign - "$f"
            codesign --verify "$f" && echo "  验证通过"
          done

      - name: 上传签名产物
        uses: actions/upload-artifact@v4
        with:
          name: cpa-sync-macos-signed
          path: dist/**/cpa-sync
          if-no-files-found: error
          compression-level: 1

  # ---------------- 汇总 ----------------
  summary:
    needs: [linux, macos-sign]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 列表 + 校验和
        run: |
          find dist -type f -name cpa-sync -exec ls -lh {} \;
          for f in dist/*/cpa-sync; do
            printf "%s  " "$(sha256sum "$f" | cut -d' ' -f1)"
            echo "$f"
          done
