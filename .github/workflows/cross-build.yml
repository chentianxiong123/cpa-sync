# 推送后自动交叉编译 4 个目标平台：
#   linux x86_64 / linux arm64 / macos arm64 / macos x86_64（后两个合成 universal）
#
# 交叉策略（不用 Docker，尽量贴近 runner 原生工具链）：
#   - linux x86_64   : runner 原生 gcc（rusqlite bundled 要编译 sqlite C 源码）
#   - linux arm64    : cargo-zigbuild（zig cc 自带 arm64 libc，无需装交叉工具链）
#   - macos          : macos-latest 是 arm64，原生编 aarch64；
#                      x86_64 用同一 SDK 交叉编，最后 lipo 成 universal
name: cross-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------- Linux ----------------
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: 安装 zig（仅 arm64 交叉需要）
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          curl -fsSL -o zig.tar.xz https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz
          sudo tar -xf zig.tar.xz -C /opt
          echo "/opt/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"

      - name: 装依赖（rusqlite bundled 要系统 g++）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 装 cargo-zigbuild
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cargo-zigbuild --locked

      - name: 构建
        env:
          CARGO_TARGET_DIR: target-${{ matrix.target }}
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cargo zigbuild --release --target aarch64-unknown-linux-gnu
          else
            cargo build --release --target x86_64-unknown-linux-gnu
          fi

      - name: 校验产物
        run: |
          BIN=target-${{ matrix.target }}/release/cpa-sync
          file "$BIN"
          ls -lh "$BIN"
          test -x "$BIN"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cpa-sync-${{ matrix.target }}
          path: rs/target-${{ matrix.target }}/release/cpa-sync
          if-no-files-found: error
          compression-level: 1

  # ---------------- macOS ----------------
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 构建 aarch64（runner 原生架构）
        env:
          CARGO_TARGET_DIR: target-aarch64
        run: cargo build --release --target aarch64-apple-darwin

      - name: 构建 x86_64（同一 SDK 交叉）
        env:
          CARGO_TARGET_DIR: target-x86_64
        run: cargo build --release --target x86_64-apple-darwin

      - name: 合并成 universal
        run: |
          mkdir out
          lipo -create -output out/cpa-sync \
            target-aarch64/release/cpa-sync \
            target-x86_64/release/cpa-sync
          lipo -info out/cpa-sync
          file out/cpa-sync
          codesign --force --sign - out/cpa-sync   # ad-hoc 签名，防 Gatekeeper 拦

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cpa-sync-universal-apple
          path: rs/out/cpa-sync
          if-no-files-found: error
          compression-level: 1

  # ---------------- 汇总 ----------------
  summary:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: 列表 + 校验和
        run: |
          find dist -type f -name cpa-sync -exec ls -lh {} \;
          for f in dist/*/cpa-sync; do
            printf "%s  " "$(sha256sum "$f" | cut -d' ' -f1)"
            echo "$f"
          done
