# cpa-sync / agent-sync 配置 —— 模板（脱敏，供参考/发行）
#
# 同一份 config 结构：
#   - cpa-sync（中心）：中心机 config/cpa-config.yaml（已 .gitignore，不进仓库）
#   - agent-sync（客户端）：拷到目标机后填 base_url + api_key
# 用法：cp config/cpa-config.example.yaml config/cpa-config.yaml
#       然后填你的 base_url / api_key。
#
# 中心机：cpa-sync apply 一键分发到所有下游；
# 目标机：agent-sync apply 本机自拉（只需 base_url + api_key + targets）。

cpa:
  # CPA (cli-proxy-api) 网关地址 —— 替换成你的
  base_url: "http://YOUR_CPA_IP:8317/v1"
  # CPA 的 API key —— 替换成你的
  api_key: "YOUR_CPA_API_KEY"
  # 供应商标识：下游（pi/opencode 等）用它作 provider 的 key。
  # 有意义且稳定（默认 "cpa"），不要用随机 UUID；历史 UUID 会自动迁移。
  provider_id: "cpa"

  # 模型：留空 = 动态扫 CPA 的 /v1/models，扫出什么就配什么（用户期望）
  # 若只想配部分模型，才在这里列白名单（支持带前缀 sensenova/deepseek-v4-flash）
  include_models: []

  # 排除清单（支持通配符，* 匹配任意字符）。默认空 = 全配。
  exclude_models: []

  # 全局上下文窗口（tokens）：所有下游统一
  context_window: 256000
  # 全局最大输出 tokens
  max_tokens: 16384
  # codex 的自动压缩阈值（model_auto_compact_token_limit）：
  # 与 context_window 一起由中央配置统一控制，改这里即全改（codex 专属）
  auto_compact_token_limit: 200000

  # 每个模型的覆盖字段（可选）：contextWindow / maxTokens / input / reasoning
  # 模型级覆盖优先于全局 context_window。
  model_overrides:
    sensenova-6.8-flash-lite:
      input: ["text", "image"]

# 模型同步策略:
#   merge   = 只增不删：补上白名单里缺的，但保留下游已有的额外模型
#   replace = 全盘对齐：下游严格等于 CPA 扫出的模型（白名单没有的会被删除）
# 注意：base_url / api_key 始终精确覆盖，不受此策略影响。
# 当前固定 replace：每次同步都重新对齐 CPA 模型，不留旧模型。
strategy: replace

# ── 机器注册表（记忆哪些机器、什么系统）──
# 每台接入的机器：ssh 别名 + 系统类型（win=Windows / unix=macOS·Linux）
hosts:
  win11:
    ssh: win11
    platform: win
  macos:
    ssh: macos
    platform: unix

# ── adapter 接入点（可配置可选择）──
# 每个 adapter 可接多台机器；host 必须能在 hosts 里找到（或直接写 ssh 别名）
# name 是接入点名（用于 CLI --host 选择 / GUI 勾选）
adapter_instances:
  omp:
    - { name: win11, host: win11, path: "C:\\Users\\a1\\.omp\\agent\\models.yml" }
    - { name: macos, host: macos, path: "/Users/a1/.omp/agent/models.yml" }
  dsh:
    - { name: win11, host: win11, path: "C:\\Users\\a1\\.dsh\\profiles\\web\\cordis.patch.yml" }

# 要同步的下游应用（adapter 名）。空 = 全部已注册的 adapter。
# 对应 adapters/ 下的模块：pi / opencode / claude / codex / omp / dsh
targets:
  - dsh
  - omp
  - pi
  - opencode
  - claude
  - codex
