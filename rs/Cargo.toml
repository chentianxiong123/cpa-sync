[package]
name = "cpa-sync"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
glob = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"

[profile.release]
# 分发形态：体积/内存优先（opt-level z + 单 codegen + 去 unwinding 表）
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
debug = false
